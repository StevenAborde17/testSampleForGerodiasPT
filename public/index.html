<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an account - Gerodias PT</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-[#f8faf8] font-sans antialiased">

  <!-- Left Branding Panel -->
  <div class="w-full md:w-5/12 bg-[#136b3a] p-8 md:p-16 flex flex-col justify-center text-white min-h-[220px] md:min-h-screen">
    <div class="flex items-center space-x-3 mb-4">
      <div class="w-10 h-10 bg-white text-[#136b3a] font-bold text-xl rounded-lg flex items-center justify-center shadow-sm">
        G
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Gerodias PT</h1>
    </div>
    <p class="text-emerald-100 text-sm max-w-xs leading-relaxed">
      Create an account to get access to the company data.
    </p>
  </div>

  <!-- Right Form Container -->
  <div class="w-full md:w-7/12 flex items-center justify-center p-6 md:p-12">
    <div class="w-full max-w-md bg-white rounded-2xl p-8 shadow-sm border border-gray-100/80">
      
      <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Create an account</h2>
      <p class="text-xs text-gray-500 mt-1 mb-6">Enter your details below to submit a registration request.</p>

      <form id="registerForm" class="space-y-4">
        <!-- First Name Field -->
        <div>
          <label for="firstName" class="block text-xs font-semibold text-gray-700 mb-1.5">First name</label>
          <input 
            type="text" 
            id="firstName" 
            name="firstName" 
            required
            class="w-full px-3.5 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#136b3a] focus:border-transparent transition-all"
          />
        </div>

        <!-- Last Name Field -->
        <div>
          <label for="lastName" class="block text-xs font-semibold text-gray-700 mb-1.5">Last name</label>
          <input 
            type="text" 
            id="lastName" 
            name="lastName" 
            required
            class="w-full px-3.5 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#136b3a] focus:border-transparent transition-all"
          />
        </div>

        <!-- Email Field -->
        <div>
          <label for="email" class="block text-xs font-semibold text-gray-700 mb-1.5">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            required
            class="w-full px-3.5 py-2.5 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#136b3a] focus:border-transparent transition-all"
          />
        </div>

        <!-- Feedback Message Alert -->
        <div id="message" class="hidden text-xs font-medium p-3 rounded-lg text-center mt-2"></div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="w-full py-3 px-4 bg-[#136b3a] hover:bg-[#0f542e] text-white text-sm font-medium rounded-lg shadow-sm transition-colors duration-150 mt-2"
        >
          Create account
        </button>
      </form>

      <!-- Footer Link -->
      <p class="text-xs text-center text-gray-600 mt-6">
        Already registered? <a href="/login" class="text-[#136b3a] font-semibold underline hover:text-[#0f542e]">Log in</a>
      </p>

    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();

      messageDiv.className = "hidden text-xs font-medium p-3 rounded-lg text-center mt-2";

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName, lastName, email })
        });

        const data = await res.json();

        messageDiv.classList.remove('hidden');
        if (res.ok) {
          messageDiv.textContent = data.message || 'Registration received. Your account is pending approval.';
          messageDiv.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
          form.reset();
        } else {
          messageDiv.textContent = data.message || 'Registration failed.';
          messageDiv.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-200');
        }
      } catch (err) {
        console.error(err);
        messageDiv.textContent = 'Network error. Please check your connection.';
        messageDiv.classList.remove('hidden');
        messageDiv.classList.add('bg-red-50', 'text-red-600', 'border', 'border-red-200');
      }
    });
  </script>
</body>
</html>
